<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solar — Embed</title>
  <link rel="stylesheet" href="embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="embed-header">
      <div id="currentDay" class="day-label"></div>
      <div class="day-picker-group">
        <button id="monday" class="dayPicker" type="button" aria-label="Show Monday">m</button>
        <button id="tuesday" class="dayPicker" type="button" aria-label="Show Tuesday">t</button>
        <button id="wednesday" class="dayPicker" type="button" aria-label="Show Wednesday">w</button>
        <button id="thursday" class="dayPicker" type="button" aria-label="Show Thursday">t</button>
        <button id="friday" class="dayPicker" type="button" aria-label="Show Friday">f</button>
        <button id="saturday" class="dayPicker" type="button" aria-label="Show Saturday">s</button>
        <button id="sunday" class="dayPicker" type="button" aria-label="Show Sunday">s</button>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </div>
    <div id="embed-timetable"></div>
  </div>
  <script src="embed.js"></script>
</body>
</html>
