<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class = "header">
        <picture class="sigil">
            <source srcset="sigilblack.png" media="(prefers-color-scheme: light)">
            <source srcset="sigilwhite.png" media="(prefers-color-scheme: dark)">
            <img src="sigilblack.png" alt="sigil">
        </picture>
        <h1>Solar</h1>
    </header>

    <!-- date selector -->
    <label for="datePicker">date:</label>
    <input type="date" id="datePicker" title="Select a date">

    <!-- timetable -->
    <h2>timetable</h2>
    <div id="timetable"></div>

    <!-- journal -->
    <h2>journal</h2>
    <textarea id="journal" placeholder="..."></textarea>

    <br>

    <button id="saveBtn">save locally</button>
    <button id="exportBtn">export as .txt</button>

    <script src="script.js"></script>
</body>
</html>
